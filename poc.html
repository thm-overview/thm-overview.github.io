<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Binär-Download</title>
</head>
<body>

    <button onclick="triggerBinaryDownload()">Download Datei</button>

    <script>
        function base64ToBlob(base64, contentType) {
            const byteCharacters = atob(base64);
            const byteNumbers = new Array(byteCharacters.length);
            
            for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
            }
            
            const byteArray = new Uint8Array(byteNumbers);
            return new Blob([byteArray], { type: contentType });
        }

        function triggerBinaryDownload() {           
            const sampleBase64 = "R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
            const fileName = "calc.exe";
            
            const blob = base64ToBlob(sampleBase64, "octet/stream");
            const blobUrl = URL.createObjectURL(blob);

            const area = document.createElement('area');
            area.href = blobUrl;
            area.download = fileName;

            document.body.appendChild(area);
            area.click();
            document.body.removeChild(area);

            setTimeout(() => {
                URL.revokeObjectURL(blobUrl);
            }, 100);
        }
    </script>
</body>
</html>
