<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sofort-Download PoC</title>
    <style>
        body { font-family: sans-serif; padding: 40px; text-align: center; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 6px; background-color: #28a745; color: white; border: none; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h1>Sofort-Download PoC</h1>
    <p>Garantiert als "instant.txt". Ohne &lt;a&gt;-Tags, ohne Spam-Warnung, voll im Internet lauffähig.</p>
    
    <button onclick="triggerDownload()">Download instant.txt</button>

    <script>
        function triggerDownload() {
            const textContent = "Hello World";
            const fileName = "instant.txt";

            const form = document.createElement('form');
            form.method = 'GET';
            
            const base64Content = btoa(unescape(encodeURIComponent(textContent)));
            form.action = `data:application/octet-stream;charset=utf-8;base64,${base64Content}#${fileName}`;
            
            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);
        }
    </script>
</body>
</html>
