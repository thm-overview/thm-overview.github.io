<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant Download PoC</title>
    <style>
        body { font-family: sans-serif; padding: 40px; text-align: center; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 6px; background-color: #28a745; color: white; border: none; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h1>Sofort-Download PoC</h1>
    <p>Vollständig kompatibel mit HTTPS im Internet. Ohne Blockaden, ohne &lt;a&gt;-Tags.</p>
    
    <button onclick="triggerDownload()">Download instant.txt</button>

    <script>
        async function triggerDownload() {
            const textContent = "Hello World";
            const fileName = "instant.txt";

            const file = new File([textContent], fileName, { type: "text/plain" });

            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        files: [file],
                        title: fileName
                    });
                } catch (err) {
                    console.error("Download abgebrochen:", err);
                }
            } else {
                alert("Der Browser blockiert alle direkten Speicher-APIs ohne sichtbare HTML-Links.");
            }
        }
    </script>
</body>
</html>
