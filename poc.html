<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sofort-Download PoC</title>
    <style>
        body { font-family: sans-serif; padding: 40px; text-align: center; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; border-radius: 6px; background-color: #28a745; color: white; border: none; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h1>Sofort-Download PoC</h1>
    <p>Funktioniert im Internet via HTTPS. Ohne &lt;a&gt;-Tags, ohne "Speichern unter", garantiert als instant.txt.</p>
    
    <button onclick="triggerDownload()">Download instant.txt</button>

    <script>
        function triggerDownload() {
            const textContent = "Hello World";
            const fileName = "instant.txt";

            const blob = new Blob([textContent], { type: "application/octet-stream" });
            const blobUrl = URL.createObjectURL(blob);

            const area = document.createElement('area');
            area.href = blobUrl;
            area.download = fileName;

            document.body.appendChild(area);
            area.click();
            document.body.removeChild(area);

            setTimeout(() => {
                URL.revokeObjectURL(blobUrl);
            }, 100);
        }
    </script>
</body>
</html>
